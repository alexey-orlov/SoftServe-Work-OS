# Shared facts — one fact, several homes. The resolve stage settles each fact ONCE and
# every consumer item is written from that single value; the verify stage checks the
# surfaces still agree before the report renders. This is what keeps ARR in the
# fundamentals block, business-info Key Metrics, and the segmentation totals from
# drifting apart at install time.
facts:
  - id: company-product-oneliner
    label: "Company + product one-liner"
    consumers: [bi-basic-info, bi-core-product, root-fundamentals]
  - id: icp
    label: "Ideal customer profile"
    consumers: [bi-icp, root-fundamentals]
  - id: problem-statement
    label: "Core problem solved"
    consumers: [bi-problem, root-fundamentals]
  - id: pricing-shape
    label: "Business model + pricing shape"
    consumers: [bi-revenue-model, root-fundamentals]
  - id: arr
    label: "ARR / revenue"
    consumers: [bi-key-metrics, root-fundamentals, seg-general]
  - id: north-star
    label: "North Star metric + its definition"
    consumers: [bi-key-metrics, root-fundamentals]
  - id: competitor-list
    label: "Named main competitors"
    consumers: [bi-competitive-landscape, cl-competitors, cm-general, root-fundamentals]
  - id: quarter-focus
    label: "This quarter's focus theme"
    consumers: [q-themes, root-fundamentals]
  - id: segments
    label: "Customer segments / segmentation axes vocabulary"
    consumers: [bi-customer-segments, seg-axes]

# Adjacent setup surfaces the intake table POINTS AT but context-core never collects —
# each has its own owner; listing them keeps the "what else exists" picture honest:
handled-elsewhere:
  - "Product code access → /connect-code (engineering/code-repos.yaml)"
  - "Tool servers (Slack, tracker, analytics, design) → /connect-mcps"
  - "Metric reporting conventions → /customize-os metric-conventions"
  - "House document formats → /customize-os template targets"
  - "Prototyping design grounding → /customize-os design-system"
  - "User-research source + meeting cadences → /customize-os research-source"
  - "Initiative pages & per-initiative context → /customize-os initiatives"
  - "Audience writing guides (handbook/writing-guides/) → planned target; fill by hand meanwhile"
