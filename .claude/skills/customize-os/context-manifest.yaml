# Context Manifest — the coverage spine of the customize-os context-core target.
#
# One row per steering item the guided setup must account for. This single file drives
# FOUR surfaces, which is what guarantees they never drift apart:
#   1. the intake table shown to the user (rendered from `groups`, coarse level)
#   2. the extraction targets given to context-extractor subagents (`items`)
#   3. the completion report (same groups/items, with per-item filled | GAP status)
#   4. the web-enrichment candidate list (`web: true` items still at GAP)
#
# Granularity rule: items sit at the ### subsection level of their target file. Field-level
# detail (the individual bracketed placeholders inside a subsection) is defined by the
# template itself and is NOT duplicated here — the write stage fills a subsection's fields
# from the template, the verify stage checks every placeholder inside a covered subsection
# is either filled or explicitly `[GAP: …]`-marked. One source of field truth: the template.
#
# Drift guard: the verify stage cross-checks every `section` below against the actual
# headings of `file` at run time. A mismatch (template evolved, manifest didn't) is
# reported in the readout — never silently skipped. Keep this file in the same change as
# any steering-template heading change.
#
# `web:` marks items whose facts are typically discoverable from authoritative public
# sources (company site, docs, pricing page, filings, reputable press). It gates ONLY
# eligibility for the optional web-enrichment pass — never a license to infer. Judgment
# sections (positioning, differentiation thesis, personas, internal metrics) stay
# web: false even when adjacent facts are public.
#
# Read by: /customize-os (targets/context-core.md). Written by: skill maintainers only.

version: 1
updated: 2026-08-20

groups:
  # tier: core — the "highly recommended" half of the intake table.
  - id: company-basics
    label: "Company & product identity"
    tier: core
    sources_hint: "website + one-pager, pitch/sales deck, About page"
  - id: customers
    label: "Customers — segments, ICP, personas"
    tier: core
    sources_hint: "sales deck, ICP one-pager, persona docs, CRM export"
  - id: value-prop
    label: "Problem & value proposition"
    tier: core
    sources_hint: "pitch deck, website messaging, positioning doc"
  - id: strategy-goals
    label: "Mission, strategy & current OKRs"
    tier: core
    sources_hint: "strategy memo, OKR doc / planning sheet"
  - id: business-model
    label: "Business model, pricing & key metrics"
    tier: core
    sources_hint: "pricing page, board/metrics deck (facts extracted, file never stored)"
  - id: team-channels
    label: "Team roster & channels"
    tier: core
    sources_hint: "org chart, Slack workspace (a connected Slack/GitHub MCP can pull IDs)"
  - id: stakeholders
    label: "Stakeholder map"
    tier: core
    sources_hint: "org chart + who-cares-about-what notes; not web-discoverable"
  - id: segmentation
    label: "Segmentation matrix (accounts + ARR)"
    tier: core
    sources_hint: "a dedicated segmentation sheet/CRM export beats any doc that merely mentions segments"
  # tier: later — the "nice to have, can set up later" half.
  - id: market-competition
    label: "Market & competitive landscape"
    tier: later
    sources_hint: "competitive docs, analyst notes; web-enrichable for public facts"
  - id: gtm
    label: "Go-to-market motion"
    tier: later
    sources_hint: "GTM/marketing plan, sales playbook"
  - id: product-dev
    label: "Product development process"
    tier: later
    sources_hint: "engineering handbook, process docs"
  - id: culture
    label: "Culture, values & product principles"
    tier: later
    sources_hint: "values page, internal principles doc"
  - id: platform-model
    label: "Platform model (product internals)"
    tier: later
    sources_hint: "architecture/permission docs — filled with PM + Engineer together"
  - id: tech-constraints
    label: "Tech constraints & do-not-re-implement registry"
    tier: later
    sources_hint: "Engineer-owned — collect from the engineering lead"

