# Product map — the AREAS → FEATURES catalog. The durable half of the product graph.
#
# Structure: areas: → {area-slug} → features: → {feature-slug} → durable facts.
# An area is a product in a multi-product business, or a large functional section of
# one product. A feature belongs to exactly ONE area (move the block to re-parent —
# refs never embed the area, so nothing breaks). Feature slugs are globally unique,
# and unique against initiative slugs too (link contract: governance/link-schema.yaml).
#
# This file holds NO artifact paths and NO work state — artifacts and activity live on
# initiative pages (product/initiatives/{slug}.md, frontmatter `features:`/`areas:`
# declares the join; the OS Console rolls a feature's artifacts up through its
# initiatives). Durable facts only:
#   name:         display name
#   status:       planned | live | retired   ("in progress" is DERIVED — an active
#                 initiative targets it; /prioritize-requests reads live-ness here)
#   shipped:      YYYY-MM-DD — first GA date; written by /feature-launch-gate on PASS,
#                 the sole status writer (it flips planned → live in the same change)
#   description:  one line, what it does for whom
#   figma:        optional stable design pointer (file ids, not display names)
#
# New entries: proposed `status: planned` in the same gated prompt as the initiative
# that introduces them (usually /prd-draft's registration step). Killed bets: the kill
# flow proposes removing a planned-only entry. Gated — every change needs your yes.
#
# Replace the example areas below with your own product areas during /customize-os
# (it seeds this catalog from your documents and public site). Keep one as a shape
# reference until real entries land.

areas:

  billing:
    name: Billing & Credits
    description: Usage-based pricing surface — credits, burn visibility, overage, promos.
    features:

      credit-usage-dashboard:
        name: Credit Usage Dashboard
        status: live
        shipped: 2026-03-20
        description: In-app credit balance, burn by workspace/API key, projected depletion, low-balance warning.

      tier-discount-promo:
        name: Tier Discount Promo
        status: planned
        description: Orgs buying overage two consecutive months get the next tier at 20% off for 3 months.

  data-export:
    name: Data Export
    description: Getting enriched data out of Beacon — exports, schedules, presets.
    features: {}
    # No features yet — demand recorded in user-insights/feature-requests/
    # (scheduled-csv-export); the entry lands here `planned` when an initiative picks it up.

  workforce:
    name: Workforce
    description: Team operations inside Beacon workspaces — absence, coverage, approvals.
    features:

      time-off-requests:
        name: Team Time-Off & Coverage
        status: planned
        description: Request → decide → coverage-handoff loop with allowances and a team calendar.

