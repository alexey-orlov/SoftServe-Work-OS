# Write Policy — which files agents change freely, and which need a human first.
#
# This registry is the single traceable list of protected context. The OS admin
# edits it here; everything that enforces the policy reads from here:
#   - .claude/hooks/write-guard.sh   (in-session: native confirm prompt on protected paths)
#   - GitHub push ruleset            (server-side hard stop; path list generated from this
#                                     file — see os-installation/claude-code/scheduled-governance.md)
#   - .github/workflows/wiki-lint.yml (weekly audit: lists commits that touched protected paths)
#
# Tier semantics:
#   auto    — DEFAULT for any path not listed below. Agents write and commit directly.
#             Covers raw material, records (summaries, decisions, results), deliverables
#             (PRDs, analyses), navigation CLAUDE.md files, the ledger, health reports.
#   confirm — the distilled steering files. An agent must show the exact before/after and
#             get an in-session yes BEFORE writing. Headless/scheduled runs cannot confirm:
#             they write a proposal to product-development/_meta/proposals/ instead.
#   admin   — the system's own rules. Only the steward changes these (via reviewed PR).
#
# Paths are repo-root-relative. Globs use shell fnmatch (`*` does not cross `/`, `**` does).

version: 1

# Who approves admin-tier changes and reviews the weekly protected-path audit.
steward: "[Your Name]"   # ← fill during setup (see Team table in root CLAUDE.md)

tiers:
  confirm:
    - CLAUDE.md                                                              # root — carries the business-fundamentals mirror block
    - product-development/feature-index.yaml                                 # the product map
    - product-development/product/strategy/business-context/business-info.md
    - product-development/product/strategy/business-context/segmentation-matrix.md
    - product-development/product/strategy/business-context/stakeholders.md
    - product-development/product/strategy/current-quarter.md

  admin:
    - product-development/_meta/write-policy.yaml                            # this file
    - .claude/references/**
    - .claude/settings.json
    - .claude/hooks/**
    - .claude/skills/**
    - .claude/agents/**
    - .claude/commands/**
    - .github/**

# Living pages — edit-in-place current-truth files (auto tier unless listed above).
# Informational: /wiki-lint verifies each exists, carries a `_updated:` header, and
# stays within its size budget. Extend this list as the wiki grows.
living-pages:
  - product-development/product/initiatives/*.md
  - product-development/product/customers/accounts/*/account-context.md
  - product-development/product/strategy/business-context/business-info.md
  - product-development/product/strategy/business-context/segmentation-matrix.md
  - product-development/product/strategy/business-context/stakeholders.md
  - product-development/product/strategy/current-quarter.md
  - product-development/product/competitive-research/competitive-landscape.md
  - product-development/product/competitive-research/competitive-matrix*.md

# ---------------------------------------------------------------------------
# Automation settings
#
# Read by .claude/hooks/auto-commit.sh when a turn ends. They live here, next to
# the tiers they refer to, so the rule and the behaviour cannot drift apart.
#
# BOTH SHIP DISABLED. Turn one on by setting `enabled: true`. Changing anything
# here is an admin-tier change (this file) — steward only.
# ---------------------------------------------------------------------------
settings:

  # Commit the turn's work automatically when Claude finishes responding.
  auto-commit:
    enabled: false

    # Which changed files may be committed:
    #   auto-tier           — only paths NOT matched by tiers.confirm / tiers.admin
    #                         above. Steering files and system rules still need a
    #                         human. This is the setting that matches the write-guard.
    #   product-development — everything under product-development/, any tier
    #   all                 — every tracked change in the repo
    scope: auto-tier

    # Commit subject prefix — see "Commit prefixes" in the root CLAUDE.md.
    message-prefix: "context:"

  # Merge the working branch into the target branch after a successful commit.
  # Does nothing unless auto-commit is enabled, and nothing when already on the
  # target branch (auto-commit alone has already landed the work there).
  auto-merge:
    enabled: false
    target-branch: main

    #   ff-only      — merge only when target can fast-forward. No checkout, no
    #                  merge commit, nothing to leave half-done. Recommended.
    #   merge-commit — always create a merge commit. Requires checking the target
    #                  out and back; the hook restores your branch on any failure.
    strategy: ff-only

    # Refuse to merge a branch whose commits touched confirm- or admin-tier paths,
    # even if `scope` above allowed committing them. Those land via reviewed PR.
    block-protected-tiers: true

    # Push the target branch after a successful merge. Off by default: pushing
    # publishes, and that stays a deliberate act.
    push: false
