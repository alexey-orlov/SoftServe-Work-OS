# Wiki lint — the scheduled/PR leg of the repo's self-updating loop.
# Engine-vs-scheduler split: .github/scripts/wiki-lint.sh implements the mechanical
# subset of .claude/skills/wiki-lint/SKILL.md (the spec of record). The judgment
# checks (staleness triage, contradiction sweep) run via /wiki-lint in a session.
name: wiki-lint

on:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC — weekly full pass
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  mechanical-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run mechanical wiki-lint
        id: lint
        run: |
          set -o pipefail
          bash .github/scripts/wiki-lint.sh | tee lint-report.txt

      - name: Protected-path audit (weekly)
        if: github.event_name != 'pull_request'
        run: |
          {
            echo ""
            echo "== gated-path commits (last 8 days) =="
            # Path list derived from governance/write-policy.yaml (tiers → gated) at
            # run time — the policy is the single source; nothing to keep in sync.
            PATHS=$(awk '
              /^tiers:/ { t=1; next }
              /^[a-zA-Z]/ { t=0; g=0 }
              t && /^  gated:/ { g=1; next }
              t && g && /^  [a-zA-Z]/ { g=0 }
              t && g && /^ *- / {
                sub(/^ *- */, ""); sub(/[ \t]*#.*/, ""); sub(/\/\*\*$/, "/")
                if (length($0)) print
              }' governance/write-policy.yaml)
            if [ -n "$PATHS" ]; then
              # shellcheck disable=SC2086
              git log --since="8 days ago" --name-only --pretty="format:%h %an %s" -- $PATHS | sed '/^$/d' || true
            else
              echo "WARNING: no gated paths parsed from governance/write-policy.yaml — audit ran on an empty list"
            fi
          } | tee -a lint-report.txt

      - name: Open/update weekly health issue
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Weekly wiki-lint report"
          BODY_FILE=lint-report.txt
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            gh issue comment "$EXISTING" --body-file "$BODY_FILE"
          else
            gh issue create --title "$TITLE" --body-file "$BODY_FILE" --label "wiki-health" || \
            gh issue create --title "$TITLE" --body-file "$BODY_FILE"
          fi
